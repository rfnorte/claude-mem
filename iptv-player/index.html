<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: http: data: blob:; media-src 'self' https: http: blob:; connect-src 'self' https: http:; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090B10">
  <meta name="description" content="Leitor IPTV pessoal para iPhone.">

  <!-- iOS: app em ecrã inteiro quando instalada no ecrã principal -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IPTV Player">
  <meta name="format-detection" content="telephone=no">

  <title>IPTV Player</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">

  <link rel="modulepreload" href="js/app.js">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <main id="view" class="view" tabindex="-1" aria-live="off"></main>
    <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="overlays"></div>
  </div>
  <noscript>Esta aplicação necessita de JavaScript ativo.</noscript>
</body>
</html>
